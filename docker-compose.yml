version: "3.8"

services:
  bi_platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic_bi_platform
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://dev:dev@postgres:5432/agentic_bi
      - WAREHOUSE_ENGINE=duckdb
      - ENVIRONMENT=production
    volumes:
      - bi_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: agentic_bi_postgres
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: agentic_bi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d agentic_bi"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  bi_data:
  postgres_data:
